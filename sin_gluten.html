<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetas Sin Gluten</title>
<style>
:root {
  --teal: #2aaa8a;
  --teal-dark: #1d7d66;
  --teal-light: #e0f5f0;
  --teal-mid: #b2e4d8;
  --text: #1a2e2a;
  --text-light: #4a6b63;
  --bg: #f4faf8;
  --white: #ffffff;
  --shadow: 0 2px 8px rgba(42,170,138,0.15);
  --radius: 12px;
  --warn: #e07b39;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 80px;
}
header {
  background: linear-gradient(135deg, var(--teal-dark), var(--teal));
  color: white;
  padding: 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
header p { font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }

/* TABS */
.tabs {
  display: flex;
  background: var(--white);
  border-bottom: 2px solid var(--teal-mid);
  position: sticky;
  top: 60px;
  z-index: 99;
}
.tab-btn {
  flex: 1;
  padding: 10px 4px;
  border: none;
  background: transparent;
  font-size: 0.7rem;
  color: var(--text-light);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: all 0.2s;
}
.tab-btn .icon { font-size: 1.2rem; }
.tab-btn.active {
  color: var(--teal);
  border-bottom: 3px solid var(--teal);
  font-weight: 700;
}

/* SECTIONS */
.section { display: none; padding: 12px; }
.section.active { display: block; }

/* SEARCH BAR */
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.search-bar input {
  flex: 1;
  padding: 10px 14px;
  border: 2px solid var(--teal-mid);
  border-radius: 24px;
  font-size: 0.9rem;
  outline: none;
  background: var(--white);
}
.search-bar input:focus { border-color: var(--teal); }
.search-bar button {
  padding: 10px 14px;
  background: var(--teal);
  color: white;
  border: none;
  border-radius: 24px;
  cursor: pointer;
  font-size: 0.8rem;
}

/* FILTER CHIPS */
.filter-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 12px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  padding: 5px 12px;
  border-radius: 20px;
  border: 2px solid var(--teal-mid);
  background: var(--white);
  font-size: 0.75rem;
  cursor: pointer;
  white-space: nowrap;
  color: var(--text-light);
  transition: all 0.2s;
}
.chip.active {
  background: var(--teal);
  border-color: var(--teal);
  color: white;
  font-weight: 600;
}

/* RECIPE CARDS */
.recipe-card {
  background: var(--white);
  border-radius: var(--radius);
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  border: 1px solid var(--teal-mid);
}
.recipe-header {
  padding: 12px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.recipe-header-info { flex: 1; }
.recipe-header-info h3 { font-size: 0.95rem; font-weight: 700; color: var(--text); }
.recipe-meta { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.badge {
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.badge-cat { background: var(--teal-light); color: var(--teal-dark); }
.badge-dif-baja { background: #e8f5e9; color: #2e7d32; }
.badge-dif-media { background: #fff8e1; color: #f57f17; }
.badge-dif-alta { background: #fce4ec; color: #c62828; }
.badge-time { background: #f3f0ff; color: #5e35b1; }
.recipe-icons { display: flex; gap: 6px; align-items: center; }
.fav-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  padding: 4px;
  transition: transform 0.2s;
}
.fav-btn:active { transform: scale(1.3); }
.expand-icon { color: var(--text-light); font-size: 0.9rem; transition: transform 0.3s; }
.recipe-card.open .expand-icon { transform: rotate(180deg); }

.recipe-body {
  display: none;
  border-top: 1px solid var(--teal-light);
}
.recipe-card.open .recipe-body { display: block; }

.recipe-section { padding: 12px 14px; }
.recipe-section h4 {
  font-size: 0.8rem;
  text-transform: uppercase;
  color: var(--teal);
  letter-spacing: 1px;
  margin-bottom: 8px;
  font-weight: 700;
}

/* SERVINGS SCALER */
.servings-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  background: var(--teal-light);
  padding: 8px 12px;
  border-radius: 8px;
}
.servings-row span { font-size: 0.85rem; color: var(--text-light); flex: 1; }
.servings-ctrl { display: flex; align-items: center; gap: 8px; }
.servings-ctrl button {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--teal);
  background: var(--white);
  color: var(--teal);
  font-size: 1.1rem;
  cursor: pointer;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.servings-num {
  font-weight: 700;
  color: var(--teal-dark);
  font-size: 1rem;
  min-width: 20px;
  text-align: center;
}

/* INGREDIENTS LIST */
.ing-list { list-style: none; }
.ing-list li {
  padding: 5px 0;
  border-bottom: 1px solid var(--teal-light);
  font-size: 0.875rem;
  display: flex;
  gap: 6px;
  align-items: baseline;
}
.ing-list li:last-child { border-bottom: none; }
.ing-qty { font-weight: 700; color: var(--teal-dark); min-width: 60px; }
.ing-name { color: var(--text); }

.prep-text {
  font-size: 0.875rem;
  line-height: 1.6;
  color: var(--text);
}

/* NUTRITION TABLE */
.nutri-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.nutri-table td {
  padding: 5px 8px;
  font-size: 0.8rem;
  border-bottom: 1px solid var(--teal-light);
}
.nutri-table tr:last-child td { border-bottom: none; }
.nutri-table td:first-child { color: var(--text-light); }
.nutri-table td:last-child { font-weight: 700; color: var(--teal-dark); text-align: right; }

/* SHOPPING LIST */
.shopping-section { margin-bottom: 16px; }
.shopping-section h3 {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--teal-dark);
  padding: 8px 12px;
  background: var(--teal-light);
  border-radius: 8px;
  margin-bottom: 8px;
}
.shop-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--white);
  border-radius: 8px;
  margin-bottom: 6px;
  border: 1px solid var(--teal-mid);
  cursor: pointer;
  transition: all 0.2s;
}
.shop-item.checked {
  opacity: 0.5;
  text-decoration: line-through;
  background: #f5f5f5;
}
.shop-item .check-icon { font-size: 1.1rem; }
.shop-item-qty { font-weight: 700; color: var(--teal-dark); font-size: 0.85rem; min-width: 70px; }
.shop-item-name { font-size: 0.875rem; }

/* RECIPE SELECTOR for shopping */
.recipe-selector {
  background: var(--white);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--teal-mid);
}
.recipe-selector h3 {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--teal-dark);
  margin-bottom: 10px;
}
.sel-recipe {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 4px;
  transition: background 0.15s;
}
.sel-recipe:hover { background: var(--teal-light); }
.sel-recipe input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--teal);
  cursor: pointer;
}
.sel-recipe label {
  font-size: 0.85rem;
  cursor: pointer;
  flex: 1;
}
.sel-category {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--teal);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 10px 0 4px;
}
.shop-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.shop-actions button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-gen { background: var(--teal); color: white; }
.btn-clear { background: var(--teal-light); color: var(--teal-dark); }
.btn-reset { background: #fff0ec; color: var(--warn); }
.shop-counter {
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-light);
  margin-bottom: 8px;
}
.empty-msg {
  text-align: center;
  padding: 24px;
  color: var(--text-light);
  font-size: 0.9rem;
}

/* FAVORITES */
#fav-section .empty-msg { padding: 48px 24px; }

/* BOTTOM NAV handled by tabs */
</style>
</head>
<body>
<header>
  <h1>🌾 Recetas Sin Gluten</h1>
  <p>Susana Mostto &amp; Ayelén Pérez · UNER 2022</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('recetas')">
    <span class="icon">📖</span>Recetas
  </button>
  <button class="tab-btn" onclick="showTab('favoritos')">
    <span class="icon">⭐</span>Favoritos
  </button>
  <button class="tab-btn" onclick="showTab('compras')">
    <span class="icon">🛒</span>Compras
  </button>
</div>

<!-- ===== RECETAS ===== -->
<div id="tab-recetas" class="section active">
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Buscar receta..." oninput="filterRecipes()">
    <button onclick="clearSearch()">✕</button>
  </div>
  <div class="filter-row" id="filter-chips"></div>
  <div id="recipes-container"></div>
</div>

<!-- ===== FAVORITOS ===== -->
<div id="tab-favoritos" class="section">
  <div id="fav-section"></div>
</div>

<!-- ===== COMPRAS ===== -->
<div id="tab-compras" class="section">
  <div class="recipe-selector">
    <h3>Seleccioná las recetas que vas a preparar</h3>
    <div id="recipe-selector-list"></div>
  </div>
  <div class="shop-actions">
    <button class="btn-gen" onclick="generateShoppingList()">🛒 Generar lista</button>

    <button class="btn-reset" onclick="resetShop()">↺ Limpiar</button>
  </div>
  <div class="shop-counter" id="shop-counter"></div>
  <div id="shopping-list-output"></div>
</div>

// ===========================
// STATE
// ===========================
let favorites = JSON.parse(localStorage.getItem('favs') || '[]');
let checkedShop = JSON.parse(localStorage.getItem('checkedShop') || '[]');
let activeFilter = 'Todas';
let currentServings = {};

function saveFavs() { localStorage.setItem('favs', JSON.stringify(favorites)); }
function saveShop() { localStorage.setItem('checkedShop', JSON.stringify(checkedShop)); }

// ===========================
// TABS
// ===========================
function showTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  if (name === 'favoritos') renderFavorites();
  if (name === 'compras') renderRecipeSelector();
}

// ===========================
// FILTER CHIPS
// ===========================
function buildChips() {
  const cats = ['Todas', ...new Set(RECIPES.map(r => r.cat))];
  const container = document.getElementById('filter-chips');
  container.innerHTML = cats.map(c =>
    `<button class="chip${c==='Todas'?' active':''}" onclick="setFilter(this,'${c}')">${c}</button>`
  ).join('');
}

function setFilter(el, cat) {
  activeFilter = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filterRecipes();
}

// ===========================
// RENDER RECIPES
// ===========================
function filterRecipes() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = RECIPES.filter(r => {
    const matchCat = activeFilter === 'Todas' || r.cat === activeFilter;
    const matchQ = !q || r.name.toLowerCase().includes(q) || r.cat.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  renderRecipes(filtered);
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  filterRecipes();
}

function renderRecipes(list) {
  const container = document.getElementById('recipes-container');
  if (!list.length) {
    container.innerHTML = '<div class="empty-msg">No se encontraron recetas</div>';
    return;
  }
  container.innerHTML = list.map(r => recipeCard(r)).join('');
}

function difBadge(d) {
  const cls = d==='baja'?'badge-dif-baja':d==='media'?'badge-dif-media':'badge-dif-alta';
  return `<span class="badge ${cls}">● ${d}</span>`;
}

function recipeCard(r) {
  const isFav = favorites.includes(r.id);
  const servings = currentServings[r.id] || r.servingsBase;
  const ratio = servings / r.servingsBase;
  return `
<div class="recipe-card" id="card-${r.id}">
  <div class="recipe-header" onclick="toggleCard(${r.id})">
    <div class="recipe-header-info">
      <h3>${r.name}</h3>
      <div class="recipe-meta">
        <span class="badge badge-cat">${r.cat}</span>
        ${difBadge(r.dif)}
        <span class="badge badge-time">⏱ ${r.time} min</span>
      </div>
    </div>
    <div class="recipe-icons">
      <button class="fav-btn" onclick="toggleFav(event,${r.id})">${isFav?'⭐':'☆'}</button>
      <span class="expand-icon">▼</span>
    </div>
  </div>
  <div class="recipe-body">
    <div class="recipe-section">
      <div class="servings-row">
        <span>Porciones / piezas</span>
        <div class="servings-ctrl">
          <button onclick="changeServings(event,${r.id},-1)">−</button>
          <span class="servings-num" id="srv-${r.id}">${servings}</span>
          <button onclick="changeServings(event,${r.id},1)">+</button>
        </div>
      </div>
      <h4>Ingredientes</h4>
      <ul class="ing-list">
        ${r.ings.map(i => `<li><span class="ing-qty" id="qty-${r.id}-${i.id}">${scaleQty(i.qty, ratio)} ${i.unit}</span><span class="ing-name">${i.name}</span></li>`).join('')}
      </ul>
    </div>
    <div class="recipe-section">
      <h4>Preparación</h4>
      <p class="prep-text">${r.prep}</p>
    </div>
    ${r.nutri ? `
    <div class="recipe-section">
      <h4>Información nutricional (por porción)</h4>
      <table class="nutri-table">
        ${Object.entries(r.nutri).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
      </table>
    </div>` : ''}
  </div>
</div>`;
}

function scaleQty(qty, ratio) {
  if (!qty) return '';
  const num = parseFloat(qty);
  if (isNaN(num)) return qty;
  const scaled = Math.round(num * ratio * 10) / 10;
  return scaled % 1 === 0 ? scaled.toString() : scaled.toFixed(1);
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('open');
}

function changeServings(e, id, delta) {
  e.stopPropagation();
  const r = RECIPES.find(r => r.id === id);
  const cur = currentServings[id] || r.servingsBase;
  const next = Math.max(1, cur + delta);
  currentServings[id] = next;
  document.getElementById('srv-' + id).textContent = next;
  const ratio = next / r.servingsBase;
  r.ings.forEach(i => {
    const el = document.getElementById(`qty-${id}-${i.id}`);
    if (el) el.textContent = scaleQty(i.qty, ratio) + ' ' + i.unit;
  });
}

// ===========================
// FAVORITES
// ===========================
function toggleFav(e, id) {
  e.stopPropagation();
  const btn = e.currentTarget;
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
    btn.textContent = '☆';
  } else {
    favorites.push(id);
    btn.textContent = '⭐';
  }
  saveFavs();
}

function renderFavorites() {
  const section = document.getElementById('fav-section');
  if (!favorites.length) {
    section.innerHTML = '<div class="empty-msg">Aún no marcaste favoritos.<br>Tocá ☆ en cualquier receta.</div>';
    return;
  }
  const favList = RECIPES.filter(r => favorites.includes(r.id));
  section.innerHTML = favList.map(r => recipeCard(r)).join('');
}

// ===========================
// SHOPPING LIST
// ===========================
function renderRecipeSelector() {
  const cats = [...new Set(RECIPES.map(r => r.cat))];
  let html = '';
  cats.forEach(cat => {
    html += `<div class="sel-category">${cat}</div>`;
    RECIPES.filter(r => r.cat === cat).forEach(r => {
      html += `<div class="sel-recipe">
        <input type="checkbox" id="sel-${r.id}" value="${r.id}">
        <label for="sel-${r.id}">${r.name}</label>
      </div>`;
    });
  });
  document.getElementById('recipe-selector-list').innerHTML = html;
}

function generateShoppingList() {
  const selected = [...document.querySelectorAll('#recipe-selector-list input:checked')].map(i => parseInt(i.value));
  if (!selected.length) {
    document.getElementById('shopping-list-output').innerHTML = '<div class="empty-msg">Seleccioná al menos una receta.</div>';
    document.getElementById('shop-counter').textContent = '';
    return;
  }

  // Aggregate ingredients
  const agg = {};
  selected.forEach(id => {
    const r = RECIPES.find(r => r.id === id);
    const scale = (currentServings[id] || r.servingsBase) / r.servingsBase;
    r.ings.forEach(i => {
      const key = i.name.toLowerCase().trim();
      if (!agg[key]) agg[key] = { name: i.name, qty: 0, unit: i.unit, hasNum: false };
      const num = parseFloat(i.qty);
      if (!isNaN(num)) {
        agg[key].qty += num * scale;
        agg[key].hasNum = true;
      }
    });
  });

  // Sort alphabetically and render
  const items = Object.values(agg).sort((a,b) => a.name.localeCompare(b.name));

  let html = '';
  items.forEach((item, idx) => {
    const isChecked = checkedShop.includes(idx);
    const qtyStr = item.hasNum ? `${Math.round(item.qty * 10) / 10} ${item.unit}` : item.unit || '';
    html += `<div class="shop-item${isChecked?' checked':''}" onclick="toggleShopItem(this,${idx})">
      <span class="check-icon">${isChecked?'✅':'⬜'}</span>
      <span class="shop-item-qty">${qtyStr}</span>
      <span class="shop-item-name">${item.name}</span>
    </div>`;
  });

  document.getElementById('shopping-list-output').innerHTML = html;
  updateShopCounter(items.length);
}

function toggleShopItem(el, idx) {
  el.classList.toggle('checked');
  const icon = el.querySelector('.check-icon');
  if (el.classList.contains('checked')) {
    icon.textContent = '✅';
    if (!checkedShop.includes(idx)) checkedShop.push(idx);
  } else {
    icon.textContent = '⬜';
    checkedShop = checkedShop.filter(i => i !== idx);
  }
  saveShop();
  const total = document.querySelectorAll('.shop-item').length;
  updateShopCounter(total);
}

function updateShopCounter(total) {
  const done = document.querySelectorAll('.shop-item.checked').length;
  document.getElementById('shop-counter').textContent = total ? `${done}/${total} comprados` : '';
}

function checkAllShop() {
  document.querySelectorAll('.shop-item').forEach((el, idx) => {
    el.classList.add('checked');
    el.querySelector('.check-icon').textContent = '✅';
    if (!checkedShop.includes(idx)) checkedShop.push(idx);
  });
  saveShop();
  const total = document.querySelectorAll('.shop-item').length;
  updateShopCounter(total);
}

function resetShop() {
  document.querySelectorAll('.shop-item').forEach(el => {
    el.classList.remove('checked');
    el.querySelector('.check-icon').textContent = '⬜';
  });
  checkedShop = [];
  saveShop();
  const total = document.querySelectorAll('.shop-item').length;
  updateShopCounter(total);
}

// ===========================
// INIT
// ===========================
buildChips();
filterRecipes();
</script>
